name: Build and push app image

on:
  push:
    branches: [main]
    paths-ignore:
      - "README.md"
      - "ecs/**"
  workflow_dispatch: {}

permissions:
  id-token: write   # required for OIDC federation to AWS
  contents: read

env:
  AWS_REGION: us-east-1
  # ARN output by the infra repo's 06-github-oidc.yaml stack.
  AWS_ROLE_ARN: arn:aws:iam::<AWS_ACCOUNT_ID>:role/photo-gallery-dev-github-actions-ecr-push
  ECR_REPOSITORY: photo-gallery-dev-app

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - run: pip install -r requirements-dev.txt

      - run: flake8 .

      - run: DJANGO_SECRET_KEY=ci python manage.py collectstatic --noinput

      - run: DJANGO_TESTING=true DJANGO_SECRET_KEY=ci pytest -v

  build-and-push:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Log in to Amazon ECR
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build, tag and push image
        env:
          REGISTRY: ${{ steps.ecr-login.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build -t "$REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG" -t "$REGISTRY/$ECR_REPOSITORY:latest" .
          docker push "$REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG"
          docker push "$REGISTRY/$ECR_REPOSITORY:latest"
