name: Build and push app image

on:
  push:
    branches: [main]
    paths-ignore:
      - "README.md"
  workflow_dispatch: {}

permissions:
  id-token: write   # required for OIDC federation to AWS
  contents: read

env:
  AWS_REGION: ${{ vars.AWS_REGION }}
  ECR_REPOSITORY: ${{ vars.ECR_REPOSITORY }}
  ARTIFACT_KEY: ${{ vars.ARTIFACT_KEY }}
  ARTIFACT_BUCKET: ${{ vars.ARTIFACT_BUCKET }}

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Log in to Amazon ECR
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build image
        env:
          REGISTRY: ${{ steps.ecr-login.outputs.registry }}
        run: |
          docker build -t "$REGISTRY/$ECR_REPOSITORY:latest" .

      - name: Upload deploy template to S3
        run: |
          mkdir -p dist
          cp ecs/taskdef.json ecs/appspec.yaml dist/
          cd dist && zip -r ../appspec-taskdef.zip taskdef.json appspec.yaml
          cd ..
          aws s3 cp appspec-taskdef.zip "s3://${ARTIFACT_BUCKET}/${ARTIFACT_KEY}"

      - name: Push image
        env:
          REGISTRY: ${{ steps.ecr-login.outputs.registry }}
        run: |
          docker push "$REGISTRY/$ECR_REPOSITORY:latest"

      - name: Summary
        env:
          REGISTRY: ${{ steps.ecr-login.outputs.registry }}
        run: |
          echo "Pushed: ${REGISTRY}/${ECR_REPOSITORY}:latest" >> "$GITHUB_STEP_SUMMARY"
          echo "This push triggers EventBridge -> CodePipeline -> CodeDeploy blue/green deployment." >> "$GITHUB_STEP_SUMMARY"
