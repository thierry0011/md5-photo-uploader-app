name: Build and push app image

on:
  push:
    branches: [main]
    paths-ignore:
      - "README.md"
      # Only the generated file, not the whole ecs/ dir - editing
      # taskdef.template.json or appspec.yaml must still trigger a build.
      - "ecs/taskdef.json"
  workflow_dispatch: {}

permissions:
  id-token: write   # required for OIDC federation to AWS
  contents: write   # required to commit the rendered ecs/taskdef.json back

env:
  AWS_REGION: us-east-1
  # ARN output by the infra repo's 06-github-oidc.yaml stack.
  AWS_ROLE_ARN: arn:aws:iam::711387109786:role/photo-gallery-dev-github-actions-ecr-push
  ECR_REPOSITORY: photo-gallery-dev-app
  ROOT_STACK_NAME: photo-gallery-dev-root
  DB_CREDENTIALS_SECRET_NAME: photo-gallery-dev-db-credentials
  DJANGO_SECRET_KEY_SECRET_NAME: photo-gallery-dev-django-secret-key
  # Deterministic values (account ID / region / resource name all fixed,
  # no AWS-generated random suffix) - safe as plain env vars, not secrets.
  TASK_EXECUTION_ROLE_ARN: arn:aws:iam::711387109786:role/photo-gallery-dev-ecs-task-execution
  TASK_ROLE_ARN: arn:aws:iam::711387109786:role/photo-gallery-dev-ecs-task-role
  IMAGES_BUCKET_NAME: photo-gallery-dev-images-711387109786

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - run: pip install -r requirements-dev.txt

      - run: flake8 .

      - run: DJANGO_SECRET_KEY=ci python manage.py collectstatic --noinput

      - run: DJANGO_TESTING=true DJANGO_SECRET_KEY=ci pytest -v

  build-and-push:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Log in to Amazon ECR
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@v2

      - name: Look up live infra values
        # No GitHub Secrets for these - they carry an AWS-generated random
        # suffix that changes every time their resource is recreated (e.g.
        # tearing the lab down and rebuilding it later), so a copied value
        # goes stale silently. Querying AWS directly here, every run, means
        # there's nothing to ever go stale or re-copy by hand.
        run: |
          set -euo pipefail

          cloudfront_domain=$(aws cloudformation describe-stacks \
            --stack-name "$ROOT_STACK_NAME" \
            --query "Stacks[0].Outputs[?OutputKey=='CloudFrontDomainName'].OutputValue" \
            --output text)

          db_stack_arn=$(aws cloudformation describe-stack-resource \
            --stack-name "$ROOT_STACK_NAME" --logical-resource-id DatabaseStack \
            --query "StackResourceDetail.PhysicalResourceId" --output text)
          db_endpoint=$(aws cloudformation describe-stacks \
            --stack-name "$db_stack_arn" \
            --query "Stacks[0].Outputs[?OutputKey=='DBInstanceEndpointAddress'].OutputValue" \
            --output text)

          db_secret_arn=$(aws secretsmanager describe-secret \
            --secret-id "$DB_CREDENTIALS_SECRET_NAME" --query ARN --output text)
          django_secret_arn=$(aws secretsmanager describe-secret \
            --secret-id "$DJANGO_SECRET_KEY_SECRET_NAME" --query ARN --output text)

          for name_value in "CloudFrontDomainName=$cloudfront_domain" "DBEndpointAddress=$db_endpoint" \
                             "DBCredentialsSecretArn=$db_secret_arn" "DjangoSecretKeyArn=$django_secret_arn"; do
            name="${name_value%%=*}"
            value="${name_value#*=}"
            if [ -z "$value" ] || [ "$value" = "None" ]; then
              echo "::error::Looked-up value for $name came back empty - refusing to render a broken taskdef.json."
              exit 1
            fi
          done

          echo "CLOUDFRONT_DOMAIN_NAME=$cloudfront_domain" >> "$GITHUB_ENV"
          echo "DB_ENDPOINT_ADDRESS=$db_endpoint" >> "$GITHUB_ENV"
          echo "DB_CREDENTIALS_SECRET_ARN=$db_secret_arn" >> "$GITHUB_ENV"
          echo "DJANGO_SECRET_KEY_SECRET_ARN=$django_secret_arn" >> "$GITHUB_ENV"

      - name: Render ecs/taskdef.json from the template
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq gettext-base
          envsubst < ecs/taskdef.template.json > ecs/taskdef.json

      - name: Commit rendered taskdef.json if it changed
        run: |
          if git diff --quiet --exit-code -- ecs/taskdef.json; then
            echo "No changes to ecs/taskdef.json - nothing to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add ecs/taskdef.json
          git commit -m "chore: render ecs/taskdef.json [skip ci]"
          git push
        # Committed and pushed *before* the ECR push below, so CodePipeline's
        # git-sourced AppSource action never reads a taskdef.json older than
        # the image it's about to deploy.

      - name: Build, tag and push image
        env:
          REGISTRY: ${{ steps.ecr-login.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build -t "$REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG" -t "$REGISTRY/$ECR_REPOSITORY:latest" .
          docker push "$REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG"
          docker push "$REGISTRY/$ECR_REPOSITORY:latest"
